[env]
AGENTMEMORY_URL = "https://agentmemory-api.wibrow.dev"
MEMINI_BASE_URL = "https://memini-api.wibrow.dev"
KANIDM_URL = "https://idm.wibrow.dev"
GOAT_API_URL = "https://goat.wibrow.dev"
INFISICAL_DOMAIN = "https://eu.infisical.com"
ATUIN_SYNC_ADDRESS = "https://atuin.wibrow.dev"
LITELLM_MASTER_KEY = { age = "" }
LITELLM_API_KEY = { age = "" }

[tools]
python = "3.14"
uv = "latest"
node = "24"
go = "latest"
opentofu = "latest"
terraform = "1.16.4"
tflint = "latest"
bun = "1.3.14"
pre-commit = "latest"

[tasks."secret:set"]
description = "Age-encrypt a secret into the private mise config. Usage: mise run secret:set NAME (prompts hidden; also accepts value on stdin)"
usage = 'arg "<name>"'
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
name="$usage_name"
if [ -t 0 ]; then
  printf "Enter value for '%s': " "$name" >&2
  stty -echo; IFS= read -r value || true; stty echo; echo >&2
else
  IFS= read -r value || true
fi
[ -n "$value" ] || { echo "error: empty value" >&2; exit 1; }
src="$HOME/.config/dotfiles-private/mise.toml"
mise trust --quiet "$src" 2>/dev/null || true
mise set --age-encrypt --file "$src" "$name=$value"
echo "Stored '$name' age-encrypted in $src (commit it in that repo)" >&2
'''

[tasks."secret:rm"]
description = "Remove a secret from the private mise config. Usage: mise run secret:rm NAME"
usage = 'arg "<name>"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise unset --file "$HOME/.config/dotfiles-private/mise.toml" "$usage_name"
'''

[tasks."secrets:scrub"]
description = "Delete lines containing any of the given secret prefixes from local files. Usage: mise run secrets:scrub -- <prefix1,prefix2,...> <file> [file...] [--dry-run]"
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd "${MISE_ORIGINAL_CWD:-.}"

usage() {
  cat >&2 <<'EOF'
Usage: mise run secrets:scrub -- <prefix1,prefix2,...> <file> [file...] [--dry-run]
  e.g. mise run secrets:scrub -- xoxb-,xoxp-,xapp-,sk-ant-,ghp_,ghu_ ~/.claude/history.jsonl *.jsonl
Matches are literal substrings (not regex): a line is deleted if it contains
any given prefix anywhere. Each modified file is backed up to
<file>.bak.<timestamp> first.
EOF
  exit 1
}

dry_run=false
rest=()
for a in "$@"; do
  case "$a" in
    --dry-run) dry_run=true ;;
    *) rest+=("$a") ;;
  esac
done
[ -n "${rest[1]:-}" ] || usage

IFS=',' read -r -a prefixes <<< "${rest[0]}"
files=("${rest[@]:1}")

grep_args=()
for p in "${prefixes[@]}"; do
  [ -n "$p" ] && grep_args+=(-e "$p")
done
[ -n "${grep_args[0]:-}" ] || { echo "error: no prefixes given" >&2; exit 1; }

for f in "${files[@]}"; do
  [ -f "$f" ] || { echo "skip (not a file): $f" >&2; continue; }
  hits=$(grep -nF "${grep_args[@]}" "$f" || true)
  [ -n "$hits" ] || continue
  count=$(printf '%s\n' "$hits" | wc -l | tr -d ' ')
  if $dry_run; then
    echo "$f: $count matching line(s) [dry-run]"
    printf '%s\n' "$hits" | cut -d: -f1 | sed 's/^/  line /'
  else
    backup="$f.bak.$(date +%Y%m%d%H%M%S)"
    cp "$f" "$backup"
    grep -vF "${grep_args[@]}" "$backup" > "$f"
    echo "$f: removed $count line(s), backup at $backup"
  fi
done
'''

[tasks."keys:top"]
description = "Show most-used keys (keyfreq). Args: number of keys, e.g. mise run keys:top 30"
run = "keyfreq top"

[tasks."keys:reset"]
description = "Reset keyfreq counts"
run = "keyfreq reset"

[settings]
experimental = true

