maven = "latest"
cmake = "latest"
golangci-lint = "latest"
buf = "latest"
hadolint = "latest"
shellcheck = "latest"
actionlint = "latest"
act = "latest"
git-cliff = "latest"
yamllint = "latest"
"npm:renovate" = "latest"
"npm:defuddle" = "latest"
"github:sass/dart-sass" = "latest"
hugo = "latest"
auto-doc = "latest"

# shell & terminal
starship = "latest"
atuin = "latest"
carapace = "latest"
fzf = "latest"
zoxide = "latest"
direnv = "latest"
chezmoi = "latest"
tmux = "latest"
"github:joshmedeski/sesh" = "latest"
television = "latest"
bat = "latest"
eza = "latest"
fd = "latest"
ripgrep = "latest"
jq = "latest"
yq = "latest"
gum = "latest"
glow = "latest"
just = "latest"
yazi = "latest"
"aqua:neovim/neovim" = "latest"
tree-sitter = "latest"
helix = "latest"
lazygit = "latest"
gh = "latest"
worktrunk = "latest"
topgrade = "latest"
"github:fastfetch-cli/fastfetch" = "latest"
bottom = "latest"
"pipx:glances" = "latest"
"github:shshemi/tabiew" = "latest"
"github:reyamira/models" = "latest"
"github:swibrow/agent-ops" = "latest"
"github:swibrow/how" = "latest"
"github:Yakitrak/notesmd-cli" = "latest"
"github:ankitpokhrel/jira-cli" = "latest"
"pipx:gcalcli" = "latest"
opencode = "latest"
llmfit = "latest"
"pipx:huggingface_hub" = "latest"
yt-dlp = "latest"

# security
age = "latest"
sops = "latest"
mkcert = "latest"
trufflehog = "latest"
infisical = "latest"

# network & load testing
websocat = "latest"
oha = "latest"
k6 = "latest"
"go:github.com/rakyll/hey" = "latest"
"github:lance0/ttl" = "latest"

# databases
"pipx:mycli" = "latest"
"pipx:pgcli" = "latest"
"github:achristmascarl/rainfrog" = "latest"
etcd = "latest"

# cloud & IaC
awscli = "latest"
aws-sam-cli = "latest"
"pipx:awscurl" = "latest"
eksctl = "latest"
"github:awslabs/eks-node-viewer" = { version = "latest", bin = "eks-node-viewer" }
gcloud = "latest"
pulumi = "latest"
infracost = "latest"
terraform-docs = "latest"
tfswitch = "latest"
"go:github.com/jrhouston/tfk8s" = "latest"
"go:github.com/cycloidio/inframap" = "latest"

# kubernetes
kubectl = "latest"
kubectx = "latest"
kubie = "latest"
k9s = "latest"
kind = "latest"
helm = "latest"
helm-docs = "latest"
helm-cr = "latest"
helm-ct = "latest"
kustomize = "latest"
kubeconform = "latest"
kubebuilder = "latest"
kube-capacity = "latest"
argocd = "latest"
"github:argoproj-labs/argocd-autopilot" = "latest"
talosctl = "latest"
"github:postfinance/topf" = "latest"
"github:kubevirt/kubevirt" = { version = "latest", matching = "virtctl", bin = "virtctl" }
"github:kubetail-org/kubetail" = "latest"
"github:vladimirvivien/ktop" = "latest"

[tasks."keys:top"]
description = "Show most-used keys (keyfreq). Args: number of keys, e.g. mise run keys:top 30"
run = "keyfreq top"

[tasks."keys:reset"]
description = "Reset keyfreq counts"
run = "keyfreq reset"

[settings]
experimental = true
# the default (aube) fails to resolve renovate's dependencies
npm.package_manager = "npm"
