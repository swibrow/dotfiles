# atuin configuration
# https://docs.atuin.sh/configuration/config/

# sync_address comes from ATUIN_SYNC_ADDRESS in mise/config.toml; omit it here
# (an empty string fails TOML deserialization on atuin 18.x)

# Search mode: prefix, fulltext, fuzzy, or skim
search_mode = "fuzzy"

# Filter mode: global (all hosts), host, session, directory
filter_mode = "global"

# Style: auto, full, compact
style = "compact"

# Inline height (0 = fullscreen)
inline_height = 30

# Key binding mode: auto (vim in vim, emacs elsewhere)
keymap_mode = "auto"
