onboarding = false

[theme]
name = "catppuccin"
auto_switch = false
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[keys]
prefix = "ctrl+space"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+|"
split_horizontal = "prefix+\""
settings = "prefix+shift+s"
new_worktree = ""

[[keys.command]]
key = "prefix+s"
type = "popup"
command = "$HOME/.local/bin/herdr-sesh"
description = "jump to open workspace / start new at directory (sesh-style)"
width = "80%"
height = "70%"

[[keys.command]]
key = "prefix+shift+v"
type = "shell"
command = "zsh -lc 'pane=$(herdr pane split --pane \"$HERDR_ACTIVE_PANE_ID\" --direction right --focus | jq -r \".result.pane.pane_id\"); herdr pane run \"$pane\" mise exec -- claude'"
description = "new claude in vertical split"

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "zsh -lc 'pane=$(herdr pane split --pane \"$HERDR_ACTIVE_PANE_ID\" --direction down --focus | jq -r \".result.pane.pane_id\"); herdr pane run \"$pane\" mise exec -- claude'"
description = "new claude in horizontal split"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "$HOME/.local/bin/herdr-new-worktree.sh"
description = "new worktree as a sibling of the repo (<repo>.<branch>)"
width = "60%"
height = "20%"

[[keys.command]]
key = "prefix+."
type = "popup"
command = "$HOME/.local/bin/herdr-rename-workspace.sh"
description = "rename workspace (default: cwd basename)"
width = "60%"
height = "20%"

[ui]
accent = "magenta"
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.toast]
delivery = "off"
delay_seconds = 1

[ui.sound]
enabled = false

[advanced]
scrollback_limit_bytes = 50000000
