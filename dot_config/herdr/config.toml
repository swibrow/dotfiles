onboarding = false

[theme]
name = "catppuccin"
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[keys]
prefix = "ctrl+space"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+|"
split_horizontal = "prefix+\""
workspace_picker = "prefix+s"
settings = "prefix+shift+s"

[[keys.command]]
key = "prefix+shift+v"
type = "shell"
command = "zsh -lc 'pane=$(herdr pane split --current --direction right --focus | jq -r \".result.pane.pane_id\"); herdr pane run \"$pane\" mise exec -- claude'"
description = "new claude in vertical split"

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "zsh -lc 'pane=$(herdr pane split --current --direction down --focus | jq -r \".result.pane.pane_id\"); herdr pane run \"$pane\" mise exec -- claude'"
description = "new claude in horizontal split"

[[keys.command]]
key = "prefix+."
type = "popup"
command = "zsh -lc 'cwd=$(herdr pane current | jq -r \".result.pane.foreground_cwd // .result.pane.cwd\"); d=$(basename \"$cwd\"); printf \"rename workspace to [%s]: \" \"$d\"; read name; herdr workspace rename \"$HERDR_WORKSPACE_ID\" \"${name:-$d}\"'"
description = "rename workspace (default: cwd basename)"
width = "60%"
height = "20%"

[ui]
accent = "magenta"
agent_panel_sort = "priority"

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[advanced]
scrollback_limit_bytes = 50000000
